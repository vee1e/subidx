services:
  - type: web
    name: subidx
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: CORS_ORIGINS
        sync: false
        value: https://your-dashboard.vercel.app
    disks:
      - name: subidx-store
        mountPath: /var/data
        sizeGB: 5
